services:
  db:
    image: pgautoupgrade/pgautoupgrade:17-alpine
    hostname: db
    restart: unless-stopped
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
    volumes:
      - ${POSTGRES_DATA_DIR:-./postgres-data}:/var/lib/postgresql/data

  app:
    build: .
    image: heartexlabs/label-studio:latest
    restart: unless-stopped
    depends_on:
      - db
    environment:
      - DJANGO_DB=default
      - POSTGRE_NAME=postgres
      - POSTGRE_USER=postgres
      - POSTGRE_PASSWORD=
      - POSTGRE_PORT=5432
      - POSTGRE_HOST=db

      # Production
      - FRONTEND_HMR=false
      - LABEL_STUDIO_HOST=${LABEL_STUDIO_HOST:-http://localhost:8080}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      - USE_NGINX_FOR_UPLOADS=false
      - JSON_LOG=1
      # Optional but recommended: set your own secret key
      # - SECRET_KEY=${SECRET_KEY}
    volumes:
      - ls-data:/label-studio/data
    expose:
      - "8000"
    command: label-studio-uwsgi

  caddy:
    image: heartexlabs/label-studio:latest
    restart: unless-stopped
    depends_on:
      - app
    environment:
      - LABEL_STUDIO_HOST=${LABEL_STUDIO_HOST:-http://localhost:8080}
      # Optional: set log level (DEBUG, INFO, WARN, ERROR)
      # - CADDY_LOG_LEVEL=WARN
    volumes:
      - ls-data:/label-studio/data
    ports:
      - "8080:8085"
    command: caddy

volumes:
  ls-data: